# Posts a checklist as a comment when a pull request is opened.
name: PR Checklist

# 1) WHEN does it run? -> Only when a pull request is opened.
on:
  pull_request:
    types: [opened]

# 2) WHAT is it allowed to do? -> Only write comments on pull requests. Nothing else.
permissions:
  pull-requests: write

jobs:
  checklist:
    name: Post checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 3) WHAT happens? -> The action posts the text below as a comment on the PR.
      - name: Post checklist comment
        # Pinned to the full commit SHA of v5.0.0 (a tag like @v5 can be moved)
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          reactions: rocket
          body: |
            👋 Hi @${{ github.event.pull_request.user.login }}, thanks for your pull request!

            Please check these points before merging:

            - [ ] I tested my changes locally
            - [ ] The description explains **what** changed and **why**
            - [ ] No passwords, tokens or private data in the code
            - [ ] The README is updated (if needed)

            📖 More details: [Contributing guide](${{ github.server_url }}/${{ github.repository }}/blob/main/CONTRIBUTING.md)

            <sub>🤖 Posted automatically by GitHub Actions with create-or-update-comment</sub>
